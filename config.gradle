ext {
    //版本
    kotlin_version = "1.3.31"
    kotlinx_coroutines = "1.3.2"

    //Android 配置，定义一个数组，使用逗号分离
    android = [
            compileSdkVersion: 30,
            buildToolsVersion: "30.0.2",
            applicationId    : "com.example.netping",
            minSdkVersion    : 16,
            targetSdkVersion : 30,
            versionCode      : 7,
            versionName      : "4.6"
    ]
    dependencies = [
            "appcompat"                    : 'androidx.appcompat:appcompat:1.1.0',
            "design"                       : 'com.google.android.material:material:1.0.0',
            "constraintlayout"             : 'androidx.constraintlayout:constraintlayout:1.1.3',
            "cardview"                     : 'androidx.cardview:cardview:1.0.0',
            "recyclerview"                 : 'androidx.recyclerview:recyclerview:1.1.0',
            "lifecycle-runtime-ktx"        : 'androidx.lifecycle:lifecycle-runtime:2.1.0',
            "core-ktx"                     : 'androidx.legacy:legacy-support-core-utils:1.0.0',
            "kotlin-stdlib-jdk7"           : "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version",
            "kotlinx-coroutines-core"      : "org.jetbrains.kotlinx:kotlinx-coroutines-core:$kotlinx_coroutines",
            "kotlinx-coroutines-android"   : "org.jetbrains.kotlinx:kotlinx-coroutines-android:$kotlinx_coroutines",
            "picasso"                      : 'com.squareup.picasso:picasso:2.5.2',
            "gson"                         : "com.google.code.gson:gson:2.8.5",
            "BaseRecyclerViewAdapterHelper": 'com.github.CymChad:BaseRecyclerViewAdapterHelper:2.9.50'
    ]
    //依赖 配置 定义一个数组
    maven = [
            "jitpack": "https://www.jitpack.io",
    ]
    //其他设置
    setting = [
            APK_NAME    : "\"netping\""
    ]
}